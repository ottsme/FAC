<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Age Calculator</title>

    <!-- Installable app -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Family Ages">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #000000;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .container {
            background: #9e0303;
            border-radius: 25px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .person-card {
            background: #000000;
            border-radius: 20px;
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-50px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .person-card.slide-in-right {
            transform: translateX(50px);
        }

        .person-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .person-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .person-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .person-card:hover::before {
            opacity: 1;
        }

        .ott   { border-left-color: #1919b3; }
        .merle { border-left-color: #d14f1b; }
        .otto  { border-left-color: #083802; }
        .klara { border-left-color: #ab0245; }

        .name-age-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: #FAEBD7;
            border-radius: 15px;
        }

        .person-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .ott .person-name   { color: #1919b3; }
        .merle .person-name { color: #d14f1b; }
        .otto .person-name  { color: #083802; }
        .klara .person-name { color: #ab0245; }

        .main-age {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
        }

        .ott .main-age   { color: #1919b3; }
        .merle .main-age { color: #d14f1b; }
        .otto .main-age  { color: #083802; }
        .klara .main-age { color: #ab0245; }

        .time-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        .time-item {
            font-size: 1rem;
            font-weight: 700;
            text-align: right;
            padding: 0.5rem 0.75rem;
            background: #FAEBD7;
            border-radius: 10px;
            border-right: 3px solid;
            font-family: 'Space Mono', monospace;
            transition: all 0.3s ease;
        }

        .time-item:hover {
            transform: translateX(-5px);
            background: #F5F5DC;
        }

        .ott .time-item { 
            color: #1919b3;
            border-right-color: #1919b3;
        }
        .merle .time-item { 
            color: #d14f1b;
            border-right-color: #d14f1b;
        }
        .otto .time-item { 
            color: #083802;
            border-right-color: #083802;
        }
        .klara .time-item { 
            color: #ab0245;
            border-right-color: #ab0245;
        }

        /* A short pulse (~0.8 s) once every 10 seconds, then rest.
           Uses the separate `scale` property so it doesn't block the hover slide. */
        @keyframes pulse {
            0%, 8%, 100% { opacity: 1;   scale: 1; }
            4%           { opacity: 0.8; scale: 1.03; }
        }

        .time-item.seconds {
            animation: pulse 10s ease-in-out infinite;
        }

        .ott .time-item.seconds   { box-shadow: 0 0 15px rgba(25, 25, 179, 0.3); }
        .merle .time-item.seconds { box-shadow: 0 0 15px rgba(209, 79, 27, 0.3); }
        .otto .time-item.seconds  { box-shadow: 0 0 15px rgba(8, 56, 2, 0.3); }
        .klara .time-item.seconds { box-shadow: 0 0 15px rgba(171, 2, 69, 0.3); }

        /* Tablet styles */
        @media (min-width: 768px) {
            .container {
                max-width: 480px;
                padding: 2rem;
                gap: 1.25rem;
            }

            .person-card {
                padding: 1.5rem;
            }

            .person-name {
                font-size: 1.6rem;
            }

            .main-age {
                font-size: 2.4rem;
            }

            .time-item {
                font-size: 1.1rem;
                padding: 0.625rem 1rem;
            }

            .time-details {
                gap: 0.625rem;
            }
        }

        /* Desktop styles */
        @media (min-width: 1024px) {
            .container {
                max-width: 520px;
                padding: 2.5rem;
            }

            .person-card {
                padding: 1.75rem;
            }

            .person-name {
                font-size: 1.8rem;
            }

            .main-age {
                font-size: 2.6rem;
            }

            .time-item {
                font-size: 1.2rem;
            }
        }

        /* Large desktop */
        @media (min-width: 1400px) {
            .container {
                max-width: 600px;
            }

            .person-name {
                font-size: 2rem;
            }

            .main-age {
                font-size: 3rem;
            }
        }

        /* Small screens adjustments */
        @media (max-width: 400px) {
            .container {
                padding: 1rem;
                gap: 0.75rem;
            }

            .person-card {
                padding: 1rem;
            }

            .person-name {
                font-size: 1.2rem;
            }

            .main-age {
                font-size: 1.75rem;
            }

            .time-item {
                font-size: 0.9rem;
                padding: 0.4rem 0.6rem;
            }
        }

        /* Landscape orientation */
        @media (orientation: landscape) and (max-height: 600px) {
            .container {
                padding: 1rem;
                gap: 0.75rem;
            }

            .person-card {
                padding: 0.75rem;
            }

            .time-item {
                font-size: 0.85rem;
                padding: 0.375rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="person-card ott">
            <div class="name-age-header">
                <span class="person-name">Ott</span>
                <span class="main-age" id="ott-years">0</span>
            </div>
            <div class="time-details">
                <div class="time-item" id="ott-days">0 days</div>
                <div class="time-item" id="ott-hours">0 hours</div>
                <div class="time-item" id="ott-minutes">0 minutes</div>
                <div class="time-item seconds" id="ott-seconds">0 seconds</div>
            </div>
        </div>

        <div class="person-card merle slide-in-right">
            <div class="name-age-header">
                <span class="person-name">Merle</span>
                <span class="main-age" id="merle-years">0</span>
            </div>
            <div class="time-details">
                <div class="time-item" id="merle-days">0 days</div>
                <div class="time-item" id="merle-hours">0 hours</div>
                <div class="time-item" id="merle-minutes">0 minutes</div>
                <div class="time-item seconds" id="merle-seconds">0 seconds</div>
            </div>
        </div>

        <div class="person-card otto">
            <div class="name-age-header">
                <span class="person-name">Otto</span>
                <span class="main-age" id="otto-years">0</span>
            </div>
            <div class="time-details">
                <div class="time-item" id="otto-days">0 days</div>
                <div class="time-item" id="otto-hours">0 hours</div>
                <div class="time-item" id="otto-minutes">0 minutes</div>
                <div class="time-item seconds" id="otto-seconds">0 seconds</div>
            </div>
        </div>

        <div class="person-card klara slide-in-right">
            <div class="name-age-header">
                <span class="person-name">Klara</span>
                <span class="main-age" id="klara-years">0</span>
            </div>
            <div class="time-details">
                <div class="time-item" id="klara-days">0 days</div>
                <div class="time-item" id="klara-hours">0 hours</div>
                <div class="time-item" id="klara-minutes">0 minutes</div>
                <div class="time-item seconds" id="klara-seconds">0 seconds</div>
            </div>
        </div>
    </div>

    <script>
        // Birth dates (month is 0-indexed: 0 = January, 11 = December)
        const birthDates = {
            ott:   new Date(1969, 11, 28),
            merle: new Date(1974, 0, 25),
            otto:  new Date(2006, 11, 17),
            klara: new Date(2013, 5, 4)
        };

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function calculateAge(birthDate) {
            const now = new Date();

            // Full years
            let years = now.getFullYear() - birthDate.getFullYear();
            if (now.getMonth() < birthDate.getMonth() ||
                (now.getMonth() === birthDate.getMonth() && now.getDate() < birthDate.getDate())) {
                years--;
            }

            // Total elapsed time
            const totalSeconds = Math.floor((now - birthDate) / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours   = Math.floor(totalMinutes / 60);
            const totalDays    = Math.floor(totalHours / 24);

            return {
                years:   years,
                days:    formatNumber(totalDays),
                hours:   formatNumber(totalHours),
                minutes: formatNumber(totalMinutes),
                seconds: formatNumber(totalSeconds)
            };
        }

        function updateAges() {
            Object.keys(birthDates).forEach(person => {
                const age = calculateAge(birthDates[person]);
                document.getElementById(`${person}-years`).textContent   = age.years;
                document.getElementById(`${person}-days`).textContent    = age.days + ' days';
                document.getElementById(`${person}-hours`).textContent   = age.hours + ' hours';
                document.getElementById(`${person}-minutes`).textContent = age.minutes + ' minutes';
                document.getElementById(`${person}-seconds`).textContent = age.seconds + ' seconds';
            });
        }

        // Cards slide in one after another
        function animateCards() {
            document.querySelectorAll('.person-card').forEach((card, index) => {
                setTimeout(() => card.classList.add('visible'), index * 150);
            });
        }

        // Initialize
        window.addEventListener('load', () => {
            animateCards();
            updateAges();
            setInterval(updateAges, 1000);
        });

        // Register the service worker (makes the app installable and work offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
            });
        }
    </script>
</body>
</html>
