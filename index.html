<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Family Age Calculator</title>

    <!-- Installable app -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Family Ages">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&display=swap">

    <style>
        /* =========================================================
           COLOURS - change them here, nowhere else.
           ========================================================= */
        :root {
            --color-ott:   #1919b3;
            --color-merle: #d14f1b;
            --color-otto:  #083802;
            --color-klara: #ab0245;

            --color-page:  #000000;   /* outside the red frame */
            --color-frame: #9e0303;   /* the red frame around the cards */
            --color-card:  #000000;   /* card background */
            --color-tile:  #FAEBD7;   /* light boxes holding the numbers */

            --glow-strength: 55%;     /* how strong the glow is when a counter pulses */
        }
        /* ========================================================= */

        :root {
            --font-display: 'Orbitron', 'Arial Black', sans-serif;
            --font-data: 'Space Mono', ui-monospace, 'Courier New', monospace;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body { height: 100%; }

        /* Layout: one phone screen; four cards share the height equally,
           and inside each card the four counters sit in a 2x2 grid. */
        body {
            font-family: var(--font-data);
            background: var(--color-page);
            color: var(--color-tile);
            display: flex;
            justify-content: center;
            padding:
                max(8px, env(safe-area-inset-top, 0px))
                max(10px, env(safe-area-inset-right, 0px))
                max(8px, env(safe-area-inset-bottom, 0px))
                max(10px, env(safe-area-inset-left, 0px));
            overflow: hidden;
        }

        .container {
            background: var(--color-frame);
            border-radius: 22px;
            padding: 8px;
            width: 100%;
            max-width: 460px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .person-card {
            --c: #ffffff;
            flex: 1 1 0;
            min-height: 0;
            background: var(--color-card);
            border-radius: 16px;
            border-left: 4px solid var(--c);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            opacity: 0;
            transform: translateX(-40px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .person-card.from-right { transform: translateX(40px); }
        .person-card.visible    { opacity: 1; transform: none; }

        .person-card.ott   { --c: var(--color-ott); }
        .person-card.merle { --c: var(--color-merle); }
        .person-card.otto  { --c: var(--color-otto); }
        .person-card.klara { --c: var(--color-klara); }
        .person-card { --glow: color-mix(in srgb, var(--c) var(--glow-strength), transparent); }

        .name-age-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-tile);
            border-radius: 12px;
            padding: 2px 12px;
            color: var(--c);
        }

        .person-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(1.05rem, 5vw, 1.4rem);
            letter-spacing: 1px;
        }

        .main-age {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(1.4rem, 7vw, 2rem);
            line-height: 1.2;
            padding: 0 4px;
            border-radius: 8px;
        }

        .time-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .time-item {
            background: var(--color-tile);
            color: var(--c);
            border-radius: 10px;
            border-right: 3px solid var(--c);
            padding: 3px 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 0;
        }

        .unit {
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.75;
            line-height: 1.3;
        }

        .value {
            font-weight: 700;
            font-size: clamp(0.85rem, 4.1vw, 1.15rem);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            line-height: 1.25;
        }

        /* Pulse: the box flips to the person's colour, grows and glows for ~1.2 s */
        @keyframes pulse {
            0%   { scale: 1;    background: var(--color-tile); color: var(--c); box-shadow: 0 0 0 transparent; }
            18%  { scale: 1.08; background: var(--c); color: var(--color-tile); box-shadow: 0 0 22px 4px var(--glow); }
            55%  { scale: 1.04; background: var(--c); color: var(--color-tile); box-shadow: 0 0 14px 2px var(--glow); }
            100% { scale: 1;    background: var(--color-tile); color: var(--c); box-shadow: 0 0 0 transparent; }
        }
        .pulse {
            animation: pulse 1.2s ease-out;
            position: relative;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            @keyframes pulse {
                0%, 100% { background: var(--color-tile); color: var(--c); }
                20%, 60% { background: var(--c); color: var(--color-tile); }
            }
            .person-card { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        // Birth moments. The UTC offset at the end is the clock that counts:
        // +02:00 = Estonian standard (winter) time, +03:00 = Estonian summer time.
        // Ott and Merle were born under Moscow time (+03:00), but are deliberately
        // counted by today's Estonian clock (+02:00).
        const people = [
            { id: 'ott',   name: 'Ott',   birth: new Date('1969-12-28T00:00:00+02:00') },
            { id: 'merle', name: 'Merle', birth: new Date('1974-01-25T00:00:00+02:00') },
            { id: 'otto',  name: 'Otto',  birth: new Date('2006-12-17T00:00:00+02:00') },
            { id: 'klara', name: 'Klara', birth: new Date('2013-06-04T00:00:00+03:00') }
        ];

        // Units that can pulse at :00, highest first
        const LEVELS = ['years', 'days', 'hours', 'minutes'];

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function calculateAge(birth, t) {
            const d = new Date(t);

            // Full years (birthday changes at local midnight)
            let years = d.getFullYear() - birth.getFullYear();
            if (d.getMonth() < birth.getMonth() ||
                (d.getMonth() === birth.getMonth() && d.getDate() < birth.getDate())) {
                years--;
            }

            // Total elapsed time
            const seconds = Math.floor((t - birth) / 1000);
            return {
                years,
                days:    Math.floor(seconds / 86400),
                hours:   Math.floor(seconds / 3600),
                minutes: Math.floor(seconds / 60),
                seconds
            };
        }

        // Build the cards
        const container = document.getElementById('container');
        const els = {};
        people.forEach((p, i) => {
            const card = document.createElement('section');
            card.className = `person-card ${p.id}` + (i % 2 ? ' from-right' : '');
            card.innerHTML = `
                <div class="name-age-header">
                    <span class="person-name">${p.name}</span>
                    <span class="main-age" data-u="years">0</span>
                </div>
                <div class="time-details">
                    <div class="time-item" data-u="days"><span class="unit">days</span><span class="value">0</span></div>
                    <div class="time-item" data-u="hours"><span class="unit">hours</span><span class="value">0</span></div>
                    <div class="time-item" data-u="minutes"><span class="unit">minutes</span><span class="value">0</span></div>
                    <div class="time-item" data-u="seconds"><span class="unit">seconds</span><span class="value">0</span></div>
                </div>`;
            container.appendChild(card);
            els[p.id] = {};
            card.querySelectorAll('[data-u]').forEach(el => {
                els[p.id][el.dataset.u] = { box: el, text: el.querySelector('.value') || el };
            });
        });

        function pulse(id, level) {
            const box = els[id][level].box;
            box.classList.remove('pulse');
            void box.offsetWidth; // restart the animation
            box.classList.add('pulse');
        }
        container.addEventListener('animationend', e => e.target.classList.remove('pulse'));

        // Pulse rule: at :30 the seconds pulse; at :00 only the highest unit that changed.
        // A pulse fires only if the boundary was crossed within the last 2 seconds,
        // so waking the phone never triggers a stale pulse.
        const prev = {};
        function update() {
            const t = Date.now();
            people.forEach(p => {
                const a = calculateAge(p.birth, t);
                const e = els[p.id];
                e.years.text.textContent   = a.years;
                e.days.text.textContent    = formatNumber(a.days);
                e.hours.text.textContent   = formatNumber(a.hours);
                e.minutes.text.textContent = formatNumber(a.minutes);
                e.seconds.text.textContent = formatNumber(a.seconds);

                const b = prev[p.id];
                if (b) {
                    const step = a.seconds - b.seconds;
                    if (step >= 1 && step <= 2 && Math.floor(a.seconds / 30) !== Math.floor(b.seconds / 30)) {
                        const level = LEVELS.find(u => a[u] !== b[u]) || 'seconds';
                        pulse(p.id, level);
                    }
                }
                prev[p.id] = a;
            });
        }

        // Tick just after each full second, so :00 and :30 land on time
        function loop() {
            update();
            setTimeout(loop, 1000 - (Date.now() % 1000) + 20);
        }

        document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });

        window.addEventListener('load', () => {
            document.querySelectorAll('.person-card').forEach((card, i) => {
                setTimeout(() => card.classList.add('visible'), i * 150);
            });
        });
        loop();

        // Register the service worker (makes the app installable and work offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
            });
        }
    </script>
</body>
</html>
